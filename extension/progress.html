<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Capturing…</title>
    <link rel="icon" href="icons/icon32.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        padding: 16px 18px;
        background: #fff9f3;
        color: #2b1d12;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        gap: 12px;
        user-select: none;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .top img { width: 22px; height: 22px; }
      .top .title { font-weight: 700; font-size: 14px; }
      #percent {
        margin-left: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        color: #8a6a4c;
      }
      .track {
        height: 10px;
        border-radius: 5px;
        background: #f0dcc4;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0%;
        background: #e86a2f;
        border-radius: 5px;
        transition: width 0.25s ease;
      }
      #stop {
        align-self: stretch;
        font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #e86a2f;
        background: transparent;
        color: #e86a2f;
        cursor: pointer;
      }
      #stop:hover { background: #fbeee2; }
      #stop:disabled { opacity: 0.5; cursor: default; }
      #stop:focus-visible { outline: 2px solid #e86a2f; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="top">
      <img src="icons/icon48.png" alt="" />
      <span class="title">Capturing page…</span>
      <span id="percent">0%</span>
    </div>
    <div class="track"><div id="bar"></div></div>
    <button id="stop">✕&nbsp; Stop capture</button>
    <script type="module" src="progress.js"></script>
  </body>
</html>

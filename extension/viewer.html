<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Full Page Capture</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icons/icon48.png" width="28" height="28" alt="" />
        <span>Full Page Capture</span>
      </div>
      <div class="actions">
        <span id="status">Stitching your screenshot…</span>
        <button id="zoom-toggle" class="btn icon" disabled aria-label="Zoom in" title="Zoom in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <line x1="15.5" y1="15.5" x2="21" y2="21" />
            <line x1="7.5" y1="10.5" x2="13.5" y2="10.5" />
            <line class="plus-v" x1="10.5" y1="7.5" x2="10.5" y2="13.5" />
          </svg>
        </button>
        <button id="download-png" class="btn primary" disabled>Download PNG</button>
        <button id="download-jpg" class="btn" disabled>Download JPG</button>
        <button id="download-pdf" class="btn" disabled>Download PDF</button>
      </div>
    </header>
    <main>
      <p id="error" hidden></p>
      <div id="preview"></div>
    </main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
